name: Publish

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA_EMAIL }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Zip extension
        run: |
          cd extension
          zip -r ../extension.zip .
          echo "Extension zipped: $(du -sh ../extension.zip | cut -f1)"

      - name: Get CWS access token
        id: cws_token
        run: |
          REFRESH_TOKEN=$(gcloud secrets versions access latest \
            --secret="${{ vars.CWS_REFRESH_TOKEN_SECRET }}" \
            --project="${{ vars.GCP_PROJECT }}")
          TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.CWS_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CWS_CLIENT_SECRET }}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d "grant_type=refresh_token" \
            | jq -r '.access_token')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Upload extension to CWS
        run: |
          RESPONSE=$(curl -s -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ vars.CWS_EXTENSION_ID }}" \
            -H "Authorization: Bearer ${{ steps.cws_token.outputs.token }}" \
            -H "x-goog-api-version: 2" \
            -T extension.zip)
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | jq -r '.uploadState')
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "Upload failed: $STATUS"
            exit 1
          fi

